name: alpha32 sanitized source import

on:
  push:
    branches:
      - feature/alpha32-full-source-freeze
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: feature/alpha32-full-source-freeze
          fetch-depth: 0

      - name: Reconstruct and verify sanitized source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/chunk-00.b64
          test -f .bootstrap/chunk-01.b64
          test -f .bootstrap/chunk-02.b64
          test -f .bootstrap/chunk-03.b64
          cat .bootstrap/chunk-00.b64 .bootstrap/chunk-01.b64 .bootstrap/chunk-02.b64 .bootstrap/chunk-03.b64 > /tmp/alpha32.tar.xz.b64
          base64 --decode /tmp/alpha32.tar.xz.b64 > /tmp/alpha32.tar.xz
          echo '6c50d0845c92efe4851d06466134dca936004fcf19a618d3a696c4f74a431ef8  /tmp/alpha32.tar.xz' | sha256sum -c -
          tar -xJf /tmp/alpha32.tar.xz -C .

      - name: Remove bootstrap transport and commit ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/alpha32-import.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import sanitized v2.0.0-alpha32 source snapshot'
          git push origin HEAD:feature/alpha32-full-source-freeze
