name: Export Android toolchain for alpha27

on:
  push:
    branches:
      - feature/alpha27-controlled-migration
    paths:
      - '.github/workflows/build-alpha27-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Android API 28 and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-28' \
            'build-tools;28.0.3' \
            'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-28/android.jar"
          test -x "$ANDROID_HOME/build-tools/28.0.3/aapt"
          test -x "$ANDROID_HOME/build-tools/28.0.3/zipalign"
          test -x "$ANDROID_HOME/build-tools/28.0.3/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Package portable Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/sdk/platforms export/sdk/build-tools
          cp -a "$ANDROID_HOME/platforms/android-28" export/sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/28.0.3" export/sdk/build-tools/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" export/sdk/build-tools/
          tar -C export -czf android-sdk-alpha27-toolchain.tar.gz sdk
          sha256sum android-sdk-alpha27-toolchain.tar.gz | tee android-sdk-alpha27-toolchain.tar.gz.sha256
          ls -lh android-sdk-alpha27-toolchain.tar.gz

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-alpha27-toolchain
          path: |
            android-sdk-alpha27-toolchain.tar.gz
            android-sdk-alpha27-toolchain.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
